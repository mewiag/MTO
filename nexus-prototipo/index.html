<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Nexus Inventor Lab</title>

<style>
/* Layout: app nativa de una columna. Paleta tomada del logo de Nexus (azul marino, cian del hexágono, naranja del engrane); motivo gráfico: bloques de App Inventor y hexágonos. */
:root {
  color-scheme: light;
  --page: #E8EDF1;
  --bg: #F3F6F8;
  --cell: #FFFFFF;
  --ink: #0F2C47;
  --sub: #5F7183;
  --faint: #8C9AA8;
  --sep: rgba(15, 44, 71, .14);
  --navy: #0B3050;
  --cyan: #12B0DD;
  --cyan-tint: #E3F5FB;
  --orange: #EE7A22;
  --orange-deep: #DB6A16;
  --orange-tint: #FDEEDF;
  --ok: #2E9A68;
  --block-event: #D9A43A;
  --block-call: #7D62B3;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  margin: 0;
  background: var(--page); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 28px; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 400px; margin: 0 auto; display: grid; gap: 10px; }
.notice { font-size: 13px; color: var(--sub); margin: 0 2px; }
.phone { background: var(--bg); border-radius: 34px; border: 8px solid var(--navy); overflow: clip; min-height: 760px; display: flex; flex-direction: column; }
@media (max-width: 440px) { .phone { border-width: 0; border-radius: 14px; min-height: 0; } }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 16px; height: 16px; }

.nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 48px; padding: 0 8px; background: var(--bg); border-bottom: .5px solid var(--sep); position: sticky; top: 0; z-index: 3; }
.nav.clean { border-bottom-color: transparent; }
.nav .title { font-weight: 600; font-size: 16px; }
.nav button { border: 0; background: none; font: inherit; color: var(--orange-deep); cursor: pointer; padding: 8px 6px; justify-self: start; display: flex; align-items: center; gap: 2px; }
.nav .right { justify-self: end; padding-right: 8px; display: flex; gap: 14px; color: var(--sub); }
.brandmark { display: flex; align-items: center; gap: 8px; padding-left: 8px; font-weight: 700; font-size: 15px; letter-spacing: .02em; }
.brandmark img { width: 30px; height: auto; }
main { flex: 1; padding: 4px 0 18px; }
.pad { padding: 0 16px; }
.big { font-size: 32px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 0; }
h1 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; margin: 0; line-height: 1.2; }
p { margin: 0; }
.sub { color: var(--sub); }
.small { font-size: 13px; }
.sectionhead { font-size: 13px; color: var(--sub); padding: 22px 32px 7px; display: flex; align-items: center; gap: 6px; }
.group { background: var(--cell); border-radius: 14px; margin: 0 16px; overflow: hidden; }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 11px 14px; position: relative; width: 100%; background: none; border: 0; font: inherit; color: inherit; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: 14px; border-top: .5px solid var(--sep); }
.row.tap { cursor: pointer; }
.row.tap:active { background: #EAF0F4; }
.row .t { font-size: 15.5px; font-weight: 500; display: block; }
.row .d { font-size: 13px; color: var(--sub); margin-top: 2px; display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: center; }
.row .d span { display: inline-flex; align-items: center; gap: 4px; }
.row .r { font-size: 12.5px; color: var(--faint); text-align: right; white-space: nowrap; display: flex; align-items: center; gap: 2px; }
.thumb { width: 64px; height: 64px; border-radius: 12px; overflow: hidden; flex: none; }
.thumb svg { width: 100%; height: 100%; display: block; }
.seats { display: block; height: 4px; width: 64px; border-radius: 4px; background: #E4EAEF; overflow: hidden; margin-top: 6px; }
.seats i { display: block; height: 100%; background: var(--orange); border-radius: 4px; }

.hero { margin: 12px 16px 0; border-radius: 18px; overflow: hidden; background: var(--navy); color: #fff; position: relative; }
.hero svg.art { display: block; width: 100%; height: auto; }
.hero .copy { padding: 0 16px 16px; display: grid; gap: 6px; margin-top: -6px; }
.hero .copy b { font-size: 19px; line-height: 1.25; max-width: 24ch; text-wrap: balance; }
.hero .copy span { font-size: 12.5px; opacity: .85; display: flex; gap: 10px; flex-wrap: wrap; }
.hero .copy span span { display: inline-flex; align-items: center; gap: 4px; }

.segc { display: flex; background: #E1E7EC; border-radius: 10px; padding: 2px; margin: 14px 16px 0; }
.segc button { flex: 1; border: 0; background: none; font: inherit; font-size: 13px; font-weight: 500; padding: 6px 4px; border-radius: 8px; cursor: pointer; color: var(--ink); display: inline-flex; justify-content: center; align-items: center; gap: 5px; }
.segc button[aria-pressed="true"] { background: var(--cell); box-shadow: 0 1px 3px rgba(11,48,80,.15); font-weight: 600; }
.foot { padding: 10px 32px 0; font-size: 13px; color: var(--sub); }
.link { border: 0; background: none; font: inherit; color: var(--orange-deep); cursor: pointer; padding: 0; font-weight: 500; }
.companycta { margin: 18px 16px 0; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; background: var(--cell); border-radius: 14px; padding: 12px 14px; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; width: calc(100% - 32px); }

.detailart { margin: 6px 16px 0; border-radius: 18px; overflow: hidden; }
.detailart svg { display: block; width: 100%; height: auto; }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 14px 16px 0; }
.fact { background: var(--cell); border-radius: 12px; padding: 9px 6px; display: grid; justify-items: center; gap: 4px; text-align: center; font-size: 11.5px; color: var(--sub); }
.fact svg { color: var(--cyan); }
.fact b { color: var(--ink); font-size: 13px; font-weight: 600; }
.block { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 0 16px; margin-top: 18px; }
.block .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--navy); background: var(--cyan-tint); }
.block h2 { font-size: 16.5px; font-weight: 600; margin: 3px 0 4px; }
.block ul { margin: 2px 0 0; padding: 0; display: grid; gap: 5px; }
.block li { list-style: none; display: grid; grid-template-columns: 18px 1fr; gap: 6px; }
.block li svg { color: var(--ok); margin-top: 2px; }
.mentorcard { margin: 18px 16px 0; background: var(--cell); border-radius: 16px; padding: 14px; display: grid; gap: 10px; position: relative; }
.mentorcard .q { font-size: 15.5px; line-height: 1.45; }
.mentorcard .qmark { position: absolute; right: 14px; top: 6px; font-size: 54px; line-height: 1; color: var(--orange-tint); font-family: Georgia, serif; }
.who { display: flex; align-items: center; gap: 10px; }
.face { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; overflow: hidden; }
.face svg { width: 100%; height: 100%; }
.wkchip { width: 46px; height: 30px; flex: none; }
.rubbar { display: block; height: 6px; border-radius: 6px; background: #E4EAEF; margin-top: 6px; overflow: hidden; }
.rubbar i { display: block; height: 100%; background: var(--cyan); border-radius: 6px; }
.pct { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14.5px; line-height: 1.4; }
.deliver { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 16px; }
.deliver div { background: var(--cell); border-radius: 12px; padding: 12px 8px; display: grid; justify-items: center; gap: 6px; text-align: center; font-size: 12px; color: var(--sub); }
.deliver svg { color: var(--orange-deep); width: 24px; height: 24px; }
.deliver b { font-size: 13px; color: var(--ink); }

.bottom { position: sticky; bottom: 0; background: rgba(243,246,248,.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: .5px solid var(--sep); padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 3; }
.bottom .info { font-size: 13px; color: var(--sub); display: flex; justify-content: center; align-items: center; gap: 6px; }
.btn { appearance: none; border: 0; border-radius: 13px; padding: 14px; font: inherit; font-weight: 600; font-size: 16px; background: var(--orange); color: #fff; cursor: pointer; width: 100%; text-align: center; text-decoration: none; display: flex; justify-content: center; align-items: center; gap: 8px; }
.btn:hover { background: var(--orange-deep); }
.btn.plain { background: none; color: var(--orange-deep); padding: 8px; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
h1:focus, .big:focus { outline: none; }

.formart { margin: 8px 16px 0; display: flex; align-items: center; gap: 12px; background: var(--cell); border-radius: 14px; padding: 10px 12px; }
.field { display: grid; grid-template-columns: 22px 78px 1fr; align-items: center; gap: 10px; }
.field svg { color: var(--faint); }
.field label { font-size: 15.5px; }
.field input { border: 0; background: none; font: inherit; color: var(--ink); padding: 0; width: 100%; min-width: 0; outline: none; }
.field input::placeholder { color: #A9B4BF; }
.switchrow { grid-template-columns: 22px 1fr auto; }
.switchrow .t { font-weight: 400; }
.switchrow svg { color: var(--faint); }
.switch { appearance: none; width: 51px; height: 31px; border-radius: 16px; background: #DCE3E9; position: relative; cursor: pointer; transition: background .2s; flex: none; margin: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
.switch:checked { background: var(--ok); }
.switch:checked::after { transform: translateX(20px); }
.err { color: #C0392B; font-size: 13px; padding: 8px 32px 0; }

.doneart { margin: 6px auto 14px; width: 200px; }
.doneart svg { display: block; width: 100%; height: auto; }
.credential { margin: 16px 16px 0; background: var(--cell); border-radius: 16px; padding: 16px; display: grid; gap: 12px; position: relative; overflow: hidden; }
.credential .hdr { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--sub); }
.credential .hdr img { width: 34px; }
.credential .name { font-size: 20px; font-weight: 700; }
.credential dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
.credential dt { color: var(--sub); }
.credential dd { margin: 0; }
.credential .stamp { font-size: 12px; color: var(--faint); border-top: .5px dashed var(--sep); padding-top: 10px; display: flex; align-items: center; gap: 6px; }
.credential .hexbg { position: absolute; right: -40px; top: -40px; width: 120px; opacity: .3; pointer-events: none; }
.circle { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #C5CFD8; display: grid; place-items: center; color: #fff; }
.circle.on { background: var(--ok); border-color: var(--ok); }
.circle svg { width: 14px; height: 14px; stroke-width: 2.4; }
.tag { font-size: 12px; color: var(--orange-deep); background: var(--orange-tint); padding: 2px 7px; border-radius: 6px; white-space: nowrap; }

.storeart { margin: 4px 16px 0; border-radius: 18px; overflow: hidden; }
.storeart svg { display: block; width: 100%; height: auto; }
.weeks8 { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin-top: 6px; }
.weeks8 i { height: 5px; border-radius: 3px; background: #E4EAEF; }
.weeks8 i.on { background: var(--cyan); }
.weeks8.warn i.on { background: #E0A43A; }
.summary { margin: 12px 16px 0; background: var(--cell); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; font-size: 14.5px; }
.ring { width: 56px; height: 56px; }
</style>
</head>

function hexPath(cx, cy, r) {
  const pts = []; for (let k = 0; k < 6; k++) { const a = Math.PI / 180 * (60 * k - 30); pts.push((cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1)); }
  return "M" + pts.join("L") + "Z";
}
function honeycomb(x0, y0, cols, rows, r, stroke, op) {
  let s = ""; const w = r * Math.sqrt(3);
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) s += `<path d="${hexPath(x0 + i * w + (j % 2) * w / 2, y0 + j * r * 1.5, r)}" fill="none" stroke="${stroke}" stroke-width="1.2" opacity="${op}"/>`;
  return s;
}
function barcode(x, y, h, w) {
  const pattern = [2,1,1,3,1,2,1,1,2,3,1,1,2,1,3,1,1,2]; let s = "", cx = x, unit = w / 40;
  pattern.forEach((p, k) => { if (k % 2 === 0) s += `<rect x="${cx.toFixed(1)}" y="${y}" width="${(p * unit).toFixed(1)}" height="${h}" fill="${C.navy}"/>`; cx += p * unit; });
  return s;
}

  app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { S.filtro = b.dataset.f; home(); });
  app.querySelectorAll("[data-id]").forEach(b => b.onclick = () => { S.reto = RETOS.find(r => r.id === b.dataset.id); show("detail"); });
  document.getElementById("toCompany").onclick = () => show("company");
}

  <main>
    <div class="detailart">${ART[r.id]()}</div>
    <div class="pad" style="display:grid;gap:6px;margin-top:14px">
      <p class="sub small" style="display:flex;gap:6px;align-items:center">${ic("building", "i sm")}${esc(r.empresa)} · ${r.area}</p>
      <h1>${esc(r.titulo)}</h1>
    </div>
    <div class="facts">
      <div class="fact">${ic("cal")}<b>8</b>semanas</div>
      <div class="fact">${ic("clock")}<b>~4 h</b>por semana</div>
      <div class="fact">${ic("level")}<b>${r.nivel}</b>nivel</div>

    </div>
    <div class="block"><span class="ic">${ic("target", "i sm")}</span><div><h2>El problema</h2><p>${esc(r.problema)}</p></div></div>
    <div class="block"><span class="ic">${ic("phone", "i sm")}</span><div><h2>Qué vas a construir</h2><p>${esc(r.construyes)}</p></div></div>
    <div class="block"><span class="ic">${ic("book", "i sm")}</span><div><h2>Lo que aprendes</h2><ul>${r.aprendes.map(a => `<li>${ic("check", "i sm")}<span>${esc(a)}</span></li>`).join("")}</ul></div></div>
    <div class="mentorcard"><span class="qmark" aria-hidden="true">“</span>

      <p class="q">${esc(m[3])}</p>
      <div class="who"><span class="face">${face(m[2])}</span><span class="small"><b>${esc(m[0])}</b><br><span class="sub">${esc(m[1])}, ${esc(r.empresa)}</span></span></div>
    </div>
    <p class="sectionhead">${ic("cal", "i sm")} Semana a semana</p>
    <div class="group">${SEMANAS.map(([w, t]) => `<div class="row" style="grid-template-columns:auto 1fr">${weekChip(w)}<span style="font-size:14.5px">${t}</span></div>`).join("")}</div>
    <p class="sectionhead">${ic("award", "i sm")} Cómo te evalúa ${esc(r.empresa)}</p>
    <div class="group">${r.rubrica.map(([t, p]) => `<div class="row" style="grid-template-columns:1fr auto;align-items:start"><span><span class="t" style="font-size:14.5px">${esc(t)}</span><span class="rubbar"><i style="width:${p}%"></i></span></span><span class="pct">${p}%</span></div>`).join("")}</div>
    <p class="sectionhead">${ic("box", "i sm")} Lo que entregas</p>
    <div class="deliver">
      <div>${ic("code")}<b>Tu app</b>archivo .aia</div>
      <div>${ic("video")}<b>Video demo</b>máx. 3 min</div>
      <div>${ic("present")}<b>Demo Day</b>ante la empresa</div>
    </div>
    <p class="foot">Con 70% o más recibes la microcredencial de Nexus Inventor Lab.</p>
  </main>
  <div class="bottom"><p class="info">${ic("users", "i sm")} Quedan ${r.lugares - r.ocupados} de ${r.lugares} lugares · cierra el ${r.cierre}</p>
    <button class="btn" type="button" id="go">Inscribirme</button></div>`;

function form() {
  const r = S.reto;
  app.innerHTML = `${nav("Inscripción", ["detail", "Reto"])}
  <main>
    <div class="formart">${thumb(r.id).replace('class="thumb"', 'class="thumb" style="width:48px;height:48px"')}<span><span style="font-weight:600;font-size:14.5px;display:block">${esc(r.titulo)}</span><span class="small sub">${esc(r.empresa)}</span></span></div>
    <p class="sectionhead">Tus datos</p>
    <div class="group">
      <div class="row field">${ic("user")}<label for="f-n">Nombre</label><input id="f-n" type="text" autocomplete="off" placeholder="Ana López"></div>
      <div class="row field">${ic("mail")}<label for="f-c">Correo</label><input id="f-c" type="email" autocomplete="off" placeholder="ana@correo.com"></div>
      <div class="row field">${ic("cap")}<label for="f-e">Escuela</label><input id="f-e" type="text" autocomplete="off" placeholder="CBTIS 99, 3er semestre"></div>
    </div>
    <p class="sectionhead">Cómo participas</p>
    <div class="group">
      <label class="row switchrow" for="f-eq">${ic("users")}<span class="t">Con mi equipo</span><input id="f-eq" class="switch" type="checkbox" ${S.equipo ? "checked" : ""}></label>
      <label class="row switchrow" for="f-m">${ic("shield")}<span class="t">Tengo 18 años o más</span><input id="f-m" class="switch" type="checkbox" ${S.mayor ? "checked" : ""}></label>
      <div class="row field" id="tutorRow" ${S.mayor ? "hidden" : ""}>${ic("mail")}<label for="f-t">Tutor</label><input id="f-t" type="email" autocomplete="off" placeholder="correo de tu tutor"></div>
    </div>
    <p class="foot" id="hint"></p>
    <p class="err" id="err" hidden></p>
  </main>
  <div class="bottom"><button class="btn" type="button" id="send">${ic("check")} Confirmar inscripción</button></div>`;
  wire();
  const upd = () => {
    S.equipo = document.getElementById("f-eq").checked; S.mayor = document.getElementById("f-m").checked;
    document.getElementById("tutorRow").hidden = S.mayor;
    document.getElementById("hint").textContent = (S.equipo ? "Hasta 3 personas. Después te llega un enlace para invitarlas. " : "") + (S.mayor ? "" : "Le mandamos un correo a tu tutor para que dé su permiso.");
  };
  upd();
  document.getElementById("f-eq").onchange = upd; document.getElementById("f-m").onchange = upd;
  document.getElementById("send").onclick = () => {
    const v = id => document.getElementById(id).value.trim(), miss = [];
    if (!v("f-n")) miss.push("tu nombre");
    if (!v("f-c").includes("@")) miss.push("un correo válido");
    if (!v("f-e")) miss.push("tu escuela");
    if (!S.mayor && !v("f-t").includes("@")) miss.push("el correo de tu tutor");
    const e = document.getElementById("err");
    if (miss.length) { e.textContent = "Falta " + miss.join(", ") + "."; e.hidden = false; return; }
    S.nombre = v("f-n"); show("done");
  };
}

function done() {
  const r = S.reto, first = S.nombre.split(" ")[0];
  const items = [["Inscripción al reto", true, "", "mail"]];
  if (!S.mayor) items.push(["Permiso de tu tutor", false, "pendiente", "shield"]);
  items.push(["Crear tu cuenta de MIT App Inventor", false, "", "puzzle"], ["Bienvenida con " + r.mentor[0].split(" ")[0], false, "lun 12 ene · 17:00", "video"]);
  if (S.equipo) items.push(["Invitar a tu equipo", false, "", "users"]);
  app.innerHTML = `${nav("", null)}
  <main>
    <div class="doneart">${ART.medal()}</div>
    <div class="pad" style="text-align:center;display:grid;gap:4px"><h1>Listo, ${esc(first)}</h1><p class="sub">Te mandamos un correo con los detalles.</p></div>
    <div class="credential" aria-label="Vista previa de la microcredencial">
      <div class="hdr"><img src="${MARK}" alt="Nexus Inventor Lab"><span>Folio NX-27-0142</span></div>

      <dl><dt>Reto</dt><dd>${esc(r.titulo)}</dd><dt>Avalada por</dt><dd>${esc(r.empresa)}</dd><dt>Duración</dt><dd>8 semanas</dd></dl>
      <p class="stamp">${ic("award", "i sm")} Se emite al terminar el reto con 70% o más.</p>
    </div>
    <p class="sectionhead">Antes de empezar</p>
    <div class="group">${items.map(([t, ok, tag, i]) => `<div class="row" style="grid-template-columns:auto 1fr auto"><span class="circle${ok ? " on" : ""}">${ok ? ic("check") : ""}</span><span style="display:flex;gap:8px;align-items:center;font-size:15px">${ic(i, "i sm")}${esc(t)}</span>${tag ? `<span class="tag">${tag}</span>` : "<span></span>"}</div>`).join("")}</div>
  </main>
  <div class="bottom">
    ${ENCUESTA_URL ? `<a class="btn" href="${esc(ENCUESTA_URL)}" target="_blank" rel="noopener">Terminar y contestar la encuesta</a>` : `<p class="info">Terminaste el recorrido. Regresa a la encuesta que te compartió el equipo.</p>`}
    <button class="btn plain" type="button" id="again">Ver otros retos</button>
  </div>`;
  document.getElementById("again").onclick = () => { S.reto = null; show("home"); };
}

  wire();
  document.getElementById("newReto").onclick = e => { e.currentTarget.textContent = "Aquí empezaría el formulario del reto"; };

show("home");
</script>
